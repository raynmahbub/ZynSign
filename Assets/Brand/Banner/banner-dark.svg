  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="29.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
  <g stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M 38 42 H 90"/>
    <path d="M 88 45 C 74 59 58 73 40 86"/>
    <path d="M 38 86 H 90"/>
  </g>
  <circle cx="100" cy="94" r="6.5" fill="#30D158"/>
  </g>

  <!-- Wordmark + tagline -->
  <text x="408" y="252" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#F5F5F7">ZynSign</text>
  <text x="412" y="312" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" fill="#A1A1AA">Professional iOS sideloading platform</text>

