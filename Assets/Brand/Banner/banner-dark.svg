<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="ZynSign — professional iOS sideloading platform">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C79F5"/>
      <stop offset="1" stop-color="#5A57D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C79F5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C79F5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1500" height="500" rx="28" fill="#15151D"/>
  <ellipse cx="250" cy="90" rx="420" ry="230" fill="url(#glow)"/>
  <ellipse cx="1380" cy="440" rx="420" ry="230" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1498.5" height="498.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Mark -->
