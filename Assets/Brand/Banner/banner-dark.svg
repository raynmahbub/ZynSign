  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#D4D4D8">
    <rect x="412" y="346" width="122" height="48" rx="24" fill="#1F1F29" stroke="#34343F"/>
    <text x="473" y="377" text-anchor="middle">iOS 17+</text>
    <rect x="550" y="346" width="122" height="48" rx="24" fill="#1F1F29" stroke="#34343F"/>
    <text x="611" y="377" text-anchor="middle">SwiftUI</text>
    <rect x="688" y="346" width="136" height="48" rx="24" fill="#1F1F29" stroke="#34343F"/>
