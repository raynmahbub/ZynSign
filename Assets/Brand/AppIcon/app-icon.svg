<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ZynSign app icon">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D6AF0"/>
      <stop offset="1" stop-color="#4B48C4"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed tile — the system applies the corner mask. No pre-rounded corners. -->
  <rect x="0" y="0" width="1024" height="1024" rx="0" fill="url(#tile)"/>
