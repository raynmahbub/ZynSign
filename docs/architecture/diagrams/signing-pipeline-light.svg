<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="The nine-stage ZynSign signing pipeline — Preparing through Packaging — ending in the Complete state">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8E8E93"/>
    </marker>
  </defs>

  <g font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Row 1 -->
    <g>
      <rect x="40" y="70" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="116" y="104" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">01</text>
      <text x="116" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Preparing</text>
    </g>
    <g>
      <rect x="214" y="70" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="290" y="104" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">02</text>
      <text x="290" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Validating</text>
    </g>
    <g>
      <rect x="388" y="70" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="464" y="104" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">03</text>
      <text x="464" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Frameworks</text>
    </g>
    <g>
      <rect x="562" y="70" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="638" y="104" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">04</text>
      <text x="638" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Dylibs</text>
    </g>
    <g>
      <rect x="736" y="70" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="812" y="104" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">05</text>
      <text x="812" y="130" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Extensions</text>
    </g>

    <!-- Row 2 -->
    <g>
      <rect x="736" y="230" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="812" y="264" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">06</text>
      <text x="812" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Nested apps</text>
    </g>
    <g>
      <rect x="562" y="230" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="638" y="264" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">07</text>
      <text x="638" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">App</text>
    </g>
    <g>
      <rect x="388" y="230" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="464" y="264" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">08</text>
      <text x="464" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Verifying</text>
    </g>
    <g>
      <rect x="214" y="230" width="152" height="86" rx="14" fill="#F5F5F7" stroke="#D9D9DE"/>
      <text x="290" y="264" text-anchor="middle" font-size="12.5" fill="#8E8E93" font-family="ui-monospace, 'SF Mono', Menlo, monospace">09</text>
      <text x="290" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#1D1D1F">Packaging</text>
    </g>
    <g>
      <rect x="40" y="230" width="152" height="86" rx="14" fill="#ECEBFA" stroke="#8B88E8"/>
      <text x="116" y="264" text-anchor="middle" font-size="12.5" fill="#5A57A8" font-family="ui-monospace, 'SF Mono', Menlo, monospace">DONE</text>
      <text x="116" y="290" text-anchor="middle" font-size="17" font-weight="600" fill="#2B2993">Complete</text>
      <circle cx="176" cy="246" r="5" fill="#30D158"/>
    </g>
  </g>

  <!-- Arrows: row 1, left to right -->
  <g stroke="#8E8E93" stroke-width="2" fill="none">
    <line x1="192" y1="113" x2="209" y2="113" marker-end="url(#arrow)"/>
    <line x1="366" y1="113" x2="383" y2="113" marker-end="url(#arrow)"/>
    <line x1="540" y1="113" x2="557" y2="113" marker-end="url(#arrow)"/>
    <line x1="714" y1="113" x2="731" y2="113" marker-end="url(#arrow)"/>
    <!-- Turn -->
    <path d="M812 156 V 225" marker-end="url(#arrow)"/>
    <!-- Row 2, right to left -->
    <line x1="736" y1="273" x2="719" y2="273" marker-end="url(#arrow)"/>
    <line x1="562" y1="273" x2="545" y2="273" marker-end="url(#arrow)"/>
    <line x1="388" y1="273" x2="371" y2="273" marker-end="url(#arrow)"/>
    <line x1="214" y1="273" x2="197" y2="273" marker-end="url(#arrow)"/>
  </g>

  <text x="460" y="368" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#8E8E93">Inner code first, host app last — the result is verified independently before packaging.</text>
</svg>
