name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, private keys, certificates containing sensitive material, provisioning profiles containing sensitive information, authentication tokens, or other secrets. Redact sensitive values before posting.
        If this is a security vulnerability, do not open a public issue. Follow the private reporting process in [`SECURITY.md`](https://github.com/raynmahbub/ZynSign/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: The fewer steps, the faster the fix.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How much does this block you?
      options:
        - Crash or data loss
        - A core flow is blocked (import, sign, deliver)
        - Workaround exists
        - Cosmetic
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Import / Library / Bundle Explorer
        - Certificates / Profiles
        - Smart Sign / Signing Queue / Presets
        - Entitlements Studio
        - Store / Downloads
        - Delivery / Installation Workspace
        - Settings / Analytics / Mission Control
        - Other / unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ZynSign version or commit
      placeholder: v1.0.0-rc.1 or the commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device or simulator, iOS version, and anything else relevant.
      placeholder: iPhone 15, iOS 18.2 / Simulator, iOS 17.5

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste only non-sensitive logs. Redact secrets and sensitive identifiers.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: >-
        Screenshots are welcome — redact certificate, profile, and identity
        details before attaching.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
