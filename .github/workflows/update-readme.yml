# README — auto-update when features land
#
# README is the storefront and must not drift from
#   - ZynSign.xcodeproj/project.pbxproj MARKETING_VERSION (market 0.1.0)
#   - docs/product/WHAT_DOES_NOT_EXIST.md (counts derived from its tables)
#
# When you add a feature in ZynSign/** or docs/product/** and push to
# an arena/** branch (or main), this workflow runs
# Scripts/update_readme.py and commits the fix if the badge/header
# is stale. It is the "repos readme automatically updates when add new
# features" automation the first public dev needs.
#
# Manual: python3 Scripts/update_readme.py --check  (CI) / --write (fix)
name: README Hygiene

on:
  push:
    branches:
      - "arena/**"
      - "main"
    paths:
      - "ZynSign/**"
      - "docs/product/**"
      - "README.md"
      - "ZynSign.xcodeproj/project.pbxproj"
      - "Scripts/update_readme.py"
  pull_request:
    paths:
      - "ZynSign/**"
      - "docs/product/**"
      - "README.md"
      - "ZynSign.xcodeproj/project.pbxproj"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The fixer commits to the branch that triggered it; two concurrent fixes
# would race on the same index.
concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check README freshness
        id: check
        run: |
          set -eu
          python3 Scripts/update_readme.py --check
          echo "ok=true" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Fix README (write)
        if: steps.check.outcome == 'failure'
        run: |
          set -eu
          python3 Scripts/update_readme.py
          git diff -- README.md | head -n 80

      - name: Commit fix (push branch)
        if: steps.check.outcome == 'failure' && github.event_name == 'push'
        run: |
          set -eu
          if git diff --quiet -- README.md; then
            echo "No diff after write — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): auto-sync version/badge from MARKETING_VERSION and WHAT_DOES_NOT_EXIST

          Triggered by ${{ github.sha }} on ${{ github.ref_name }} — Scripts/update_readme.py keeps README honest (market 0.1.0, counts from WHAT_DOES_NOT_EXIST tables)."
          # Push to the same branch that triggered the workflow
          BRANCH="${GITHUB_REF_NAME}"
          echo "Pushing README fix to ${BRANCH}"
          git push origin "HEAD:${BRANCH}" || {
            echo "::warning::Could not push README fix — branch moved. Pull and re-run update_readme.py locally."
            exit 0
          }

      - name: PR comment (when on pull_request)
        if: steps.check.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::README is stale — run 'python3 Scripts/update_readme.py' locally and commit."
          # Optionally comment
          gh pr comment "${{ github.event.pull_request.number }}" --body "⚠️ README is stale for \`${{ github.sha }}\`. Run \`python3 Scripts/update_readme.py\` locally and commit the fix (version/badge from \`MARKETING_VERSION\` + \`WHAT_DOES_NOT_EXIST\`)." || true
