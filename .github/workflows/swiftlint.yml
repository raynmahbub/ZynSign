# SwiftLint.
#
# Enforces the two-tier rule set pinned in .swiftlint.yml: five
# error-severity safety rules that block CI, and four complexity rules
# that warn without blocking. Logic lives in Scripts/ci/lint.sh.
name: SwiftLint

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swiftlint:
    name: SwiftLint (errors block, complexity warns)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint

      - name: Run SwiftLint
        run: Scripts/ci/lint.sh
