# 🔨 Build — one Xcode verdict for each pull request, plus manual runs.
#
# Xcode builds run on the pull-request event, which tests the proposed merge
# commit. Branch pushes do not start an Xcode build; the lightweight Quality
# workflow still runs on main/develop pushes.
#
#   hygiene              — generated state, manual release-metadata self-test,
#                          host vectors, RC audits, hardening report   (ubuntu)
#   build-and-test       — Scripts/ci/build.sh: resolve, clean, build every
#                          target, build the test targets, run unit tests,
#                          annotate failures, keep the .xcresult         (macOS)
#   lint-and-format      — SwiftLint errors block; SwiftFormat checks and
#                          Scripts/ci/format.sh apply repairs drift   (ubuntu)
#   external-validation  — ZynSign-signed artifacts judged by Apple's own
#                          codesign/otool/ditto; findings are reported  (macOS)
#
# On a pull request the same run also carries the PR gates — conventional
# title, commitlint over every commit, path labels, and the Danger Swift
# review. On demand (Actions → 🔨 Build → Run workflow) it produces the
# private test IPA: Scripts/ci/private_ipa.sh always delivers one — by
# default the unsigned `ZynSign-{tag}-{config}-private-unsigned.ipa` that
# recipients sign with their own Apple certificate (the artifact carries a
# SIGNING.md saying exactly how), or a signed ad-hoc export when a TEAM_ID
# secret is configured. A green `private-ipa` job contains an IPA; a run
# with none fails. It never creates a tag and never publishes a release.
#
# Manual-run options:
#   mode          build (verify only) | private-ipa (also deliver the IPA)
#   configuration private-ipa: Release = what users get; Debug shows every feature
#   run_unit_tests off turns the test run into a faster compile-only gate
#   note          private-ipa: a label folded into the artifact name
#
# Static gates live in 02-quality.yml; publishing lives in 03-release.yml.
# See docs/development/continuous-integration.md for what each job
# establishes and what it explicitly does not claim.
name: 🔨 Build

on:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to produce — build verifies only; private-ipa also delivers a device IPA"
        type: choice
        options: [build, private-ipa]
        default: build
      configuration:
        description: "private-ipa only: Release = what users get; Debug shows every feature"
        type: choice
        options: [Release, Debug]
        default: Release
      run_unit_tests:
        description: "Run the unit tests (off = compile-only gate, faster)"
        type: boolean
        default: true
      note:
        description: "private-ipa only: a label added to the artifact name"
        type: string
        default: ""

# Every job reads; the hardening report, the XCTest evidence, the
# external-validation artifacts and the private IPA are the workflow's
# outputs. Superseded pull-request
# updates to the same ref are cancelled — the newest commit is the one whose
# verdict matters. Manual runs are never cancelled and never cancel anything:
# a dispatch is deliberate, and a 45-minute archive should not die because
# someone clicked a button or updated a pull request.
# Jobs that comment on a pull request widen their own permissions.
permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.mode || 'checks' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pull-request builds run the full secret-policy gate in 02-quality.yml;
      # retain this local-tree check for manual Build runs.
      - name: Refuse private keys and misplaced certificates
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          # The Compatibility Lab's security suite embeds the PEM headers
          # as detection markers — it scans shared exports for key
          # material. They are fixed strings in code, never keys; the
          # exemption names that one file.
          if grep -rniE "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" \
              --exclude-dir=.git --exclude=CompatibilityLabSecurity.swift . ; then
            echo "Private key material found in the repository." >&2
            exit 1
          fi
          # Synthetic certificate text is allowed only in test fixtures, which
          # use it as rejection vectors and embed no private keys. The
          # bracket keeps this pattern from matching its own line.
          if grep -rniE "BEGIN CERT[I]FICATE" \
              --exclude-dir=.git --exclude-dir=Tests . ; then
            echo "Certificate material found outside test fixtures." >&2
            exit 1
          fi

      - name: Refuse generated artifacts and machine state
        run: |
          set -eu
          forbidden="DerivedData xcuserdata *.xcresult *.xcuserstate .DS_Store"
          failed=0
          for pattern in $forbidden; do
            if find . -path ./.git -prune -o -name "$pattern" -print | grep -q .; then
              echo "Forbidden path present: $pattern" >&2
              failed=1
            fi
          done
          exit $failed

      # The workflows are code too. A quoting mistake in a `run:` block only
      # surfaces on a runner, and `bash -n` cannot see the trap that broke a
      # scheduled sweep: two backslashes before a backtick leave the backtick
      # unescaped, so bash runs the prose as a command substitution.
      - name: Check the shell inside the workflows
        run: python3 Scripts/ci/workflow_shell_check.py

      # The Quality workflow runs this self-test for pull requests and
      # integration pushes; retain it here for manual Build dispatches, which
      # do not start the Quality workflow.
      - name: Check the release metadata derivation
        if: github.event_name == 'workflow_dispatch'
        run: Scripts/ci/release_meta.sh --self-test

      # The release verdict is decided by this script too; the self-test
      # replays every ending — including a gate cancelled because GitHub
      # never acquired a runner — so the card cannot blame the wrong job.
      - name: Check the release verdict
        run: Scripts/ci/release_verdict.sh --self-test

      - name: Test release changelog tooling
        run: python3 -m unittest discover -s Tests/Host -p 'test_*.py' -v

      - name: Run host vector checks
        run: |
          set -eu
          python3 Tests/Host/verify_macho_signing_vector.py
          python3 Tests/Host/verify_nested_code_signing_vector.py
          python3 Tests/Host/verify_zip_writer_vectors.py
          python3 Tests/Host/external_validation.py self-test

      # RC gates that belong to the host, not to a device: the crash-surface
      # inventory must still describe the code, the accessibility audit must
      # find no hard-coded colour or undersized control, and every behaviour
      # the regression catalogue freezes must name a test that exists.
      - name: Check the crash surface against its baseline
        run: python3 Scripts/audit_crash_surface.py

      - name: Audit accessibility in the sources
        run: python3 Scripts/audit_accessibility.py --strict

      - name: Refuse a pushed destination that opens its own stack
        run: python3 Scripts/audit_navigation_stack.py

      - name: Refuse an identity that is minted per read
        run: python3 Scripts/audit_identity_stability.py

      # A staged feature the app never references is a stop that ships a
      # promise and no surface. The audit allows a deferral, in a file a
      # reviewer reads, and fails when one has been repaid or forgotten.
      - name: Check every staged feature has a surface or a recorded decision
        run: python3 Scripts/audit_release_gating.py

      - name: Check the regression catalogue names real tests
        run: python3 Scripts/audit_regression_coverage.py

      # A presentation port is the shell's promise to open a surface. A port
      # the shell never installs hands every caller a silent no-op, so the
      # surface exists, tests green, and cannot be reached from the app.
      - name: Check every shell port is installed by the shell
        run: python3 Scripts/audit_presentation_ports.py

      - name: Check hand-written design values against the token baseline
        run: python3 Scripts/audit_design_tokens.py --baseline Scripts/design_tokens_baseline.json --check

      - name: Build the hardening report
        run: python3 Scripts/generate_hardening_report.py --output build/hardening/index.html

      - name: Upload the hardening report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardening-report
          path: build/hardening/index.html
          if-no-files-found: error

  build-and-test:
    name: Build and test (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest available Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show the toolchain versions
        run: |
          set -eu
          xcodebuild -version
          xcrun simctl list runtimes | head -n 20 || true

      # The project vendors no external packages today; the cache is wired
      # now so the first adopted package resolves instantly.
      - name: Restore Swift Package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'ZynSign.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # One build-and-test run per commit, not two. Scripts/ci/build.sh
      # resolves packages, cleans DerivedData, builds every target, builds
      # the test targets, runs the unit tests on a resolved simulator,
      # annotates each failing case from the result bundle, and records the
      # Xcode version, simulator destination, and a concise XCTest summary.
      # The gate lives in the script, so the workflow cannot drift from it.
      # The steps below upload that evidence on success and on failure. The
      # manual `run_unit_tests: false` switch turns the run into a
      # compile-only check; every pull request keeps the tests.
      - name: Build every target and run the unit tests
        env:
          RUN_TESTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_unit_tests) && '1' || '0' }}
        run: Scripts/ci/build.sh

      # Preserve the native result bundle after a pass and after a failure.
      # The name carries the run id and attempt so a re-run cannot hide the
      # previous bundle. Paths are an allowlist plus signing-material
      # exclusions — DerivedData, certificates, keys, and profiles are not
      # uploaded. A missing bundle warns and does not fail the job.
      # Retrieval: docs/development/continuous-integration.md
      - name: Keep signing material out of the XCTest evidence
        if: always()
        run: |
          if [[ -f Scripts/ci/xctest_evidence.py ]]; then
            python3 Scripts/ci/xctest_evidence.py prepare
          else
            echo "XCTest evidence script is not in the workspace; skipping."
          fi

      - name: Upload native XCTest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xctest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/logs/*.log
            build/logs/xctest-context.txt
            build/logs/xctest-summary.txt
            build/logs/xctest-summary.json
            build/logs/xctest-summary.md
            build/logs/xctest-results.json
            build/logs/xctest-results.md
            build/logs/ZynSignTests.xcresult
            !build/logs/**/*.p12
            !build/logs/**/*.pfx
            !build/logs/**/*.pem
            !build/logs/**/*.key
            !build/logs/**/*.p8
            !build/logs/**/*.cer
            !build/logs/**/*.crt
            !build/logs/**/*.certsigningrequest
            !build/logs/**/*.certSigningRequest
            !build/logs/**/*.mobileprovision
            !build/logs/**/*.provisionprofile
            !build/logs/**/*.xcuserstate
            !build/logs/**/.netrc
            !build/logs/**/credentials
            !build/logs/**/credentials.*
            !build/logs/**/id_rsa
            !build/logs/**/id_dsa
            !build/logs/**/id_ecdsa
            !build/logs/**/id_ed25519
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14

  # SwiftLint and SwiftFormat in one job. Lint errors block; the format check
  # blocks too. Local drift is repaired with Scripts/ci/format.sh apply — one
  # clean, reviewable diff.
  #
  # Neither tool needs Xcode: both are pure Swift source scanners, and
  # Scripts/ci/lint.sh and Scripts/ci/format.sh already run them from their
  # published Linux images when the binaries are not installed. Two jobs need a
  # macOS runner to do their work (the Xcode build and Apple's own codesign /
  # otool validation); this one held a macOS runner only to install the tools
  # with Homebrew, and a run that cannot get one fails with "the job was not
  # acquired by Runner of type hosted" — an infrastructure verdict sitting next
  # to a green build, indistinguishable at a glance from a real finding. It runs
  # on the same containerised tool versions a Mac developer reproduces with the
  # Docker fallback, so the ruleset under review is identical.
  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SwiftLint
        run: Scripts/ci/lint.sh

      - name: SwiftFormat check
        run: Scripts/ci/format.sh check

  # ZynSign-signed artifacts are independently measured by Apple's own
  # developer tooling. Missing tools or failed exports are harness failures;
  # codesign/otool/ditto verdicts are recorded findings because macOS
  # verification is not equivalent to iOS platform acceptance.
  # See docs/architecture/external-validation.md.
  external-validation:
    name: External validation (Apple tooling)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest available Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Show the toolchain versions
        run: |
          set -eu
          echo "EXPORT_ROOT=$RUNNER_TEMP/zynsign-external-validation" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          command -v codesign otool ditto unzip
          openssl version || true

      - name: Export ZynSign-signed artifacts
        id: export
        run: |
          set -u
          mkdir -p "$EXPORT_ROOT/export"
          set +e
          TEST_RUNNER_ZYNSIGN_EXPORT_DIR="$EXPORT_ROOT/export" xcodebuild test \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination "platform=iOS Simulator,name=$(Scripts/ci/select_simulator.sh),OS=latest" \
            -only-testing:ZynSignTests/ExternalValidationExportTests \
            -quiet 2>&1 | tee "$EXPORT_ROOT/export-xcodebuild.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            python3 Tests/Host/external_validation.py annotate-xcodebuild \
              "$EXPORT_ROOT/export-xcodebuild.log"
          fi

      - name: Judge the artifacts with Apple tooling
        run: |
          python3 Tests/Host/external_validation.py run \
            --export-dir "$EXPORT_ROOT/export" \
            --report-dir "$EXPORT_ROOT/report" \
            --export-status "${{ steps.export.outputs.status || 99 }}"

      - name: Upload the report and the exported artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-validation
          path: |
            ${{ env.EXPORT_ROOT }}/report
            ${{ env.EXPORT_ROOT }}/export
            ${{ env.EXPORT_ROOT }}/export-xcodebuild.log
          if-no-files-found: warn
          retention-days: 30

  # --- Pull-request gates ----------------------------------------------------
  # These four run only on a pull request. They are deliberately separate
  # jobs with their original names: a required status check that is skipped
  # never reports, and a missing required check blocks a merge forever, so
  # each one either runs or is not required.

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Kept identical to commitlint's `type-enum` and to the PR template:
          # `security` is a first-class type for fixes that harden a surface, so
          # a title using it must not be rejected here.
          types: |
            feat
            fix
            refactor
            perf
            docs
            ci
            test
            build
            chore
            style
            security
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject should not start with an uppercase letter.

  commitlint:
    name: Conventional commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository (full history for range linting)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install the commit tooling
        run: npm install --no-audit --no-fund

      - name: Lint every commit in the pull request
        run: npx --no -- commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  label-pr:
    name: Label the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  danger:
    name: Danger Swift review
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    # Danger is advisory and must not receive write access while executing
    # code from a pull request. It checks out the trusted base commit rather
    # than the PR merge commit, and can only read PR metadata.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the trusted base repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      # Danger is the reviewer who always shows up; it advises, it does not
      # block. Both steps tolerate failure and annotate what went wrong, so an
      # advisory outage never masks a healthy merge. The Homebrew download
      # cache, disabled auto-update, and no cleanup keep the tap install quick.
      - name: Restore the Homebrew download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-danger-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            homebrew-danger-${{ runner.arch }}-

      - name: Install Danger Swift
        continue-on-error: true
        run: |
          # Newer Homebrew refuses formulas from untrusted taps until the
          # tap is explicitly trusted.
          brew trust danger/tap </dev/null || true
          status=0
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install danger/tap/danger-swift 2>&1 | tee /tmp/brew-install.log || status=$?
          if [[ "${status}" -ne 0 ]]; then
            grep -E 'Error|error' /tmp/brew-install.log | tail -5 | while IFS= read -r line; do
              printf '::error title=brew::%s\n' "${line//'%'/'%25'}"
            done || true
            exit "${status}"
          fi

      - name: Run Danger
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          danger-swift ci --dangerfile Dangerfile.swift 2>&1 | tee /tmp/danger.log || status=$?
          if [[ "${status}" -ne 0 ]]; then
            grep -E 'error|Error|failed|Failed' /tmp/danger.log | tail -5 | while IFS= read -r line; do
              printf '::error title=Danger::%s\n' "${line//'%'/'%25'}"
            done || true
            exit "${status}"
          fi

  # --- Private test IPA (manual only) ----------------------------------------
  # The private → public gate from docs/releases/private-testing.md: archive
  # the commit you intend to tag and deliver an IPA for the device matrix.
  # It never creates a tag and never publishes a release. The simulator build
  # and the unit tests already ran in build-and-test above, so this job only
  # archives and packages. All of that lives in Scripts/ci/private_ipa.sh:
  #   - TEAM_ID secret set   → signed ad-hoc export
  #                            ZynSign-{tag}-{config}-private.ipa
  #   - TEAM_ID missing      → unsigned Payload package
  #                            ZynSign-{tag}-{config}-private-unsigned.ipa
  #   - no IPA at all        → the job fails (a green run always has one)
  private-ipa:
    name: Private test IPA
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'private-ipa'
    runs-on: macos-15
    needs: [hygiene, build-and-test]
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # The version is read from the release train, never typed: the private
      # build must carry the same version as the tag it is testing for. The
      # script archives, exports or packages, checksums, writes the summary
      # card, and names the artifact — the job below only ships it.
      - name: Archive and produce the IPA
        id: ipa
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTE: ${{ inputs.note }}
        run: Scripts/ci/private_ipa.sh --configuration "${{ inputs.configuration }}" --output-dir build/private

      - name: Upload the private test artifacts (never a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.ipa.outputs.artifact_name }}
          path: build/private/
          if-no-files-found: error
          retention-days: 7
