# Dependency validation.
#
# ZynSign vendors everything; a new Swift package must be allowlisted
# deliberately (Scripts/ci/dependency-allowlist.txt). Logic lives in
# Scripts/ci/dependency_check.sh.
name: Dependency Validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-validation:
    name: Enforce the dependency allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check declared packages against the allowlist
        run: Scripts/ci/dependency_check.sh
