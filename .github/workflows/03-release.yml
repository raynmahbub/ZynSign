# 🚀 Release — one tag per stop on the release train (the release system).
#
# ZynSign ships one release at a time (docs/releases/release-train.md):
#   python3 Scripts/release_train.py promote      # switch on the next features
#   # update CHANGELOG + notes, private test, merge to main
#   TAG="$(python3 Scripts/release_train.py current --tag)"
#   git tag -a "$TAG" -m "ZynSign ${TAG#v}" && git push origin "$TAG"
#
# The tag always comes from the train, so no version is ever retyped here.
#
# One tag is the whole manual step. Manually (Actions → 🚀 Release → Run
# workflow): leave the version empty to release the train's current stop, and
# set dry_run to rehearse — every gate runs and the full asset set is built,
# but nothing is published. A typed version is released only if it is the
# current stop; anything else is refused by the meta job.
#
# Stages:
#
#   0. meta       — which version this run releases: the tag, the dispatch
#                   input, or the release train's current stop when neither
#                   is given. A version that is not the current stop is
#                   refused here, before any build starts.
#   1. validate   — release-train stage, MARKETING_VERSION, changelog,
#                   notes, architecture, dependencies, docs, secrets
#   2. build      — full build and unit-test run (Scripts/ci/build.sh)
#   3. assets     — Scripts/ci/release_assets.sh: the version-stamped
#                   unsigned IPA, its SHA256, the Build Passport, MANIFEST.md
#                   and ReleaseNotes.md, all derived from the tag
#   4. publish    — GitHub Release created/updated from the generated notes,
#                   assets attached without overwriting any existing file
#   5. sync       — stage the generated CHANGELOG entry on an automation
#                   branch and open/update a reviewable PR; when the
#                   repository does not let Actions open PRs the branch
#                   stays staged and the job warns instead of failing
#   6. verdict    — one summary card: published, rehearsed, or stopped and why
#
# If any gate fails, the release stops automatically. The workflow is
# idempotent: re-running a tag repairs missing pieces without duplicating.
name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v — leave empty to release the train's current stop"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Rehearse: run every gate and build the assets, publish nothing"
        required: false
        default: false
        type: boolean

# Default to read-only. Only the trusted publish and changelog-sync jobs
# receive write permissions below.
permissions:
  contents: read

# Two releases at once is a mistake by definition; the second run waits.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Derive release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scripts/ci/release_meta.sh decides which version this run releases:
      # the tag ref, the dispatch input, or — when neither is given — the
      # release train's current stop (read from ReleaseTrain.swift through
      # Scripts/release_train.py, never hardcoded here). It refuses anything
      # that is not the current stop in this first job, on ubuntu, before a
      # macOS runner is allocated for a release that cannot ship.
      - name: Derive and validate the release version
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: Scripts/ci/release_meta.sh "${REQUESTED_VERSION}" "${REF_NAME}"

  # --- Quality gate: validation + static guards ------------------------------
  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-24.04
    needs: meta
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the release (train stage, version, changelog, notes)
        run: Scripts/ci/release_validate.sh "${{ needs.meta.outputs.version }}"

      - name: Enforce the architecture boundaries
        run: Scripts/ci/architecture_guard.sh

      - name: Enforce the dependency allowlist
        run: Scripts/ci/dependency_check.sh

      - name: Validate the documentation
        run: Scripts/ci/docs_check.sh

      - name: Scan for secret material
        run: Scripts/ci/security_scan.sh

  secret-history:
    name: Gitleaks over the full history
    runs-on: ubuntu-24.04
    needs: meta
    timeout-minutes: 15
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # --- Quality gate: the build and the tests ----------------------------------
  build-and-test:
    name: Build and run the unit tests
    runs-on: macos-15
    needs: meta
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build and test
        run: Scripts/ci/build.sh

      - name: Upload build and test logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-logs
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14

  # --- Assets: IPA, checksum, BuildInfo.json, ReleaseNotes.md ------------------
  assets:
    name: Produce the release assets
    runs-on: macos-15
    needs: [meta, quality-gate, secret-history, build-and-test]
    timeout-minutes: 45
    steps:
      - name: Check out the release source and full tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.event.repository.default_branch }}

      - name: Generate categorized changelog and release notes
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -eu
          python3 Scripts/generate_changelog.py \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --date "$(date -u +%Y-%m-%d)"
          mkdir -p build/release/changelog
          cp CHANGELOG.md build/release/changelog/CHANGELOG.md
          cp "docs/releases/notes-v${VERSION}.md" build/release/changelog/notes-v${VERSION}.md

      - name: Upload generated changelog source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-changelog
          path: build/release/changelog/
          if-no-files-found: error
          retention-days: 30

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Archive an unsigned device build
        run: |
          set -eu
          mkdir -p build/release
          xcodebuild archive \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/release/ZynSign.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet

      # Every asset is generated from the tag by one script — version-stamped
      # IPA name, checksum, Build Passport, MANIFEST.md and ReleaseNotes.md —
      # so nothing is ever renamed by hand and the naming cannot drift from
      # the version. CI logic lives in the script, not here.
      - name: Generate the release asset set
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
        run: >-
          Scripts/ci/release_assets.sh
          --archive build/release/ZynSign.xcarchive
          --out build/release/assets

      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: build/release/assets/
          if-no-files-found: error
          retention-days: 30

  # --- Publish: changelog + GitHub Release + assets ----------------------------
  publish:
    name: Publish the release
    # Skipped entirely on a dry run: the rehearsal proves every gate and
    # builds the assets, but never touches the public release.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    needs: [meta, assets]
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.event.repository.default_branch }}

      - name: Download the release assets
        # Pinned at v7.0.0 (Node 24) on purpose. v4's Node 20 runtime is
        # deprecated and annotated every run; v5's path change concerns
        # downloads by artifact ID only (this job downloads by name); v8's
        # strict Content-Type unzip policy is deliberately avoided, so v7 is
        # the newest behaviour-compatible line for what this job hands the
        # publish step.
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-assets
          path: release-assets

      - name: Refuse a tag that is not the current release-train stage
        run: python3 Scripts/release_train.py check --tag "${{ needs.meta.outputs.tag }}"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: release-assets/ReleaseNotes.md
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -eu
          test -s "${NOTES}"
          TITLE="ZynSign ${VERSION}"
          PRE_FLAG=""
          [ "${PRERELEASE}" = "true" ] && PRE_FLAG="--prerelease"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — publishing the generated or curated notes."
            # Release Drafter may have created a draft; --draft=false publishes
            # it. The notes came from the same full-history artifact build as
            # ReleaseNotes.md, and reapplying them is idempotent.
            gh release edit "${TAG}" --notes-file "${NOTES}" --title "${TITLE}" ${PRE_FLAG} --draft=false
          else
            echo "Creating release ${TAG} (channel: ${CHANNEL})"
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TITLE}" ${PRE_FLAG} --notes-file "${NOTES}"
          fi
          gh release view "${TAG}" --json tagName,name,url

      - name: Attach assets (never overwriting an existing file)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -eu
          source Scripts/ci/crystal.sh
          crystal_phase "${CRYSTAL_RELEASE}" "Release" "Attach • ${TAG}"
          # The asset set is version-stamped, so it is listed rather than
          # hardcoded — adding a sixth artifact needs no change here. The
          # never-overwrite guard keeps a re-run idempotent, and the privately
          # tested signed IPA (ZynSign.ipa) can no longer collide with the CI
          # artifact at all: their names differ by design.
          existing="$(gh release view "${TAG}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          shopt -s nullglob
          for asset in release-assets/*; do
            name="$(basename "${asset}")"
            if printf '%s\n' "${existing}" | grep -qx "${name}"; then
              crystal_info "Keeping the existing ${name} on the release"
            else
              gh release upload "${TAG}" "${asset}"
              crystal_ok "Uploaded ${name}"
            fi
          done
          crystal_card_begin "${CRYSTAL_RELEASE}" "Release Assets" "Attached to ${TAG}" "Success"
          while IFS= read -r name; do
            [ -n "${name}" ] && crystal_card_row "${name}" "on the release"
          done <<< "$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          crystal_card_end

  sync-changelog:
    name: Open the generated changelog PR
    if: ${{ !inputs.dry_run && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    needs: [meta, publish]
    timeout-minutes: 10
    outputs:
      pull-request-url: ${{ steps.changelog-pr.outputs.pull-request-url }}
      pull-request-operation: ${{ steps.changelog-pr.outputs.pull-request-operation }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the current default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Download the generated changelog artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-changelog
          path: release-changelog

      - name: Preserve current Unreleased work and apply this release entry
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          python3 Scripts/apply_release_changelog.py --version "${VERSION}" --generated-changelog release-changelog/CHANGELOG.md --generated-notes "release-changelog/notes-v${VERSION}.md"

      - name: Validate documentation after applying release notes
        run: Scripts/ci/docs_check.sh

      # The PR is opened with plain git + gh rather than a marketplace
      # action, so the step can degrade instead of failing an
      # already-published release: if this repository does not allow GitHub
      # Actions to create pull requests, the changelog stays staged on the
      # automation branch and the step finishes with a warning. When a
      # RELEASE_CHANGELOG_TOKEN secret exists (a PAT or app token), it is
      # used for the PR call, because such a token can open pull requests
      # even when the built-in GITHUB_TOKEN is not allowed to.
      - name: Create or update the release changelog PR
        id: changelog-pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_CHANGELOG_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          source Scripts/ci/crystal.sh
          crystal_phase "${CRYSTAL_RELEASE}" "Release" "Changelog Sync • v${VERSION}"

          NOTES="docs/releases/notes-v${VERSION}.md"
          BRANCH="automation/release-changelog-${VERSION}"
          TITLE="docs(changelog): add v${VERSION} release notes"
          BODY="This PR records the categorized changelog and generated release notes produced from tag \`v${VERSION}\`.

          The published GitHub Release and its assets are already complete. This PR only syncs the release record into the repository while preserving any newer \`[Unreleased]\` entries on the default branch.

          Generated by \`Scripts/apply_release_changelog.py\` and \`Scripts/generate_changelog.py\`."

          if ! git status --porcelain -- CHANGELOG.md "${NOTES}" | grep -q .; then
            crystal_info "The default branch already carries the v${VERSION} changelog — nothing to sync."
            git push origin --delete "${BRANCH}" >/dev/null 2>&1 \
              && crystal_ok "Removed the stale automation branch ${BRANCH}" \
              || crystal_info "No stale automation branch to remove."
            echo "pull-request-operation=none" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${BRANCH}"
          git add CHANGELOG.md "${NOTES}"
          git commit -m "${TITLE}"
          # The automation branch is fully owned by this job, so replacing
          # it keeps re-runs idempotent without duplicates.
          git push --force origin "${BRANCH}"
          crystal_ok "Changelog changes staged on ${BRANCH}"

          # Reuse an open PR from a previous run instead of opening a second one.
          EXISTING="$(gh pr list --head "${BRANCH}" --state open --json number,url --jq '.[0] | [.number, .url] | @tsv' || true)"
          if [ -n "${EXISTING}" ]; then
            PR_NUMBER="$(printf '%s' "${EXISTING}" | cut -f1)"
            PR_URL="$(printf '%s' "${EXISTING}" | cut -f2)"
            gh pr edit "${PR_NUMBER}" --title "${TITLE}" --body "${BODY}" >/dev/null 2>&1 \
              || crystal_warn "Could not refresh the body of PR #${PR_NUMBER}; reusing it as-is."
            echo "pull-request-url=${PR_URL}" >> "${GITHUB_OUTPUT}"
            echo "pull-request-operation=updated" >> "${GITHUB_OUTPUT}"
            crystal_ok "Reused the existing changelog PR #${PR_NUMBER}"
            exit 0
          fi

          if PR_URL="$(gh pr create --base "${DEFAULT_BRANCH}" --head "${BRANCH}" --title "${TITLE}" --body "${BODY}" --label docs 2>/dev/null)"; then
            echo "pull-request-url=${PR_URL}" >> "${GITHUB_OUTPUT}"
            echo "pull-request-operation=created" >> "${GITHUB_OUTPUT}"
            crystal_ok "Opened changelog PR ${PR_URL}"
            exit 0
          fi

          echo "::warning title=Changelog sync::The release changelog could not be opened as a PR because this repository does not allow GitHub Actions to create pull requests. The changes are staged on branch '${BRANCH}' — enable Settings → Actions → General → Workflow permissions → 'Allow GitHub Actions to create and approve pull requests' (or add a RELEASE_CHANGELOG_TOKEN secret), then re-run this job, or open the PR from the branch manually."
          echo "pull-request-operation=branch-staged" >> "${GITHUB_OUTPUT}"
          crystal_warn "Changelog staged on ${BRANCH}; PR creation is disabled for GitHub Actions in this repository."

  # --- Verdict: one card that says what happened ------------------------------
  # A dry run stops here with a rehearsal card; a real run reports the
  # published release. Either way the last thing in the log is a summary, not
  # a wall of xcodebuild output.
  verdict:
    name: Release verdict
    if: always()
    runs-on: ubuntu-24.04
    needs: [meta, assets, publish, sync-changelog]
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          ASSETS_RESULT: ${{ needs.assets.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CHANGELOG_RESULT: ${{ needs.sync-changelog.result }}
          CHANGELOG_URL: ${{ needs.sync-changelog.outputs.pull-request-url }}
          CHANGELOG_OPERATION: ${{ needs.sync-changelog.outputs.pull-request-operation }}
        run: |
          set -eu
          source Scripts/ci/crystal.sh
          if [ "${DRY_RUN}" = "true" ]; then
            crystal_card_begin "${CRYSTAL_RELEASE}" "Rehearsal Complete" "Every gate ran; nothing was published" "Success"
            crystal_card_row "Candidate" "\`${TAG}\`"
            crystal_card_row "Channel" "${CHANNEL}"
            crystal_card_row "Assets" "${ASSETS_RESULT} — see the \`release-assets\` artifact"
            crystal_card_row "Published" "No — dry run"
            crystal_card_row "Next" "Tag when ready: \`git tag -a ${TAG} -m \"ZynSign ${VERSION}\" && git push origin ${TAG}\`"
            crystal_card_end
            exit 0
          fi
          if [ "${PUBLISH_RESULT}" = "success" ] && [ "${CHANGELOG_RESULT}" = "success" ]; then
            if [ "${CHANGELOG_OPERATION}" = "branch-staged" ]; then
              crystal_card_begin "${CRYSTAL_RELEASE}" "Release Published · Changelog Staged" "Release is live; the changelog is staged but this repository does not let GitHub Actions open PRs" "Success"
              crystal_card_row "Release" "\`${TAG}\`"
              crystal_card_row "Channel" "${CHANNEL}"
              crystal_card_row "Assets" "${ASSETS_RESULT}"
              crystal_card_row "Changelog" "staged on \`automation/release-changelog-${VERSION}\`"
              crystal_card_row "Next" "Allow Actions to create pull requests (or add \`RELEASE_CHANGELOG_TOKEN\`), then re-run the sync job — or open the PR from the staged branch"
              crystal_card_end
              exit 0
            fi
            crystal_card_begin "${CRYSTAL_RELEASE}" "Release Published" "Release assets and changelog sync completed" "Success"
            crystal_card_row "Release" "\`${TAG}\`"
            crystal_card_row "Channel" "${CHANNEL}"
            crystal_card_row "Assets" "${ASSETS_RESULT}"
            if [ -n "${CHANGELOG_URL}" ]; then
              crystal_card_row "Changelog PR" "${CHANGELOG_OPERATION} — ${CHANGELOG_URL}"
            else
              crystal_card_row "Changelog" "No documentation changes were needed"
            fi
            crystal_card_end
            exit 0
          fi
          if [ "${PUBLISH_RESULT}" = "success" ]; then
            crystal_card_begin "${CRYSTAL_RELEASE}" "Release Published · Changelog Sync Needs Attention" "Release is live; its changelog PR was not created successfully" "Failure"
            crystal_card_row "Release" "\`${TAG}\` — published"
            crystal_card_row "Changelog PR" "${CHANGELOG_RESULT} — inspect the sync-changelog job"
            crystal_card_end
            exit 1
          fi
          crystal_failure_card "${CRYSTAL_RELEASE}" "Release Stopped" \
            "$([ "${ASSETS_RESULT}" != "success" ] && echo Assets || echo Publish)" \
            "A gate failed — nothing was published, or the release is incomplete" \
            "${GITHUB_SHA:0:7}" \
            "the failing job's log and the \`release-assets\` / \`release-build-logs\` artifacts"
          exit 1
