# PR quality gate.
#
# Four layers, in increasing order of strictness:
#
#   1. PR title          — must be a Conventional Commit (blocks)
#   2. Commit messages   — every commit in the PR is linted by
#                          commitlint against commitlint.config.js (blocks)
#   3. Labels            — path-based labels from .github/labeler.yml;
#                          Release Drafter reads them to group the next
#                          release notes (advisory)
#   4. Danger Swift      — the automatic senior reviewer
#                          (Dangerfile.swift); advisory, never blocks
#
# The label *definitions* (.github/labels.json) are synced weekly by
# maintenance.yml.
name: PR Quality

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            ci
            test
            build
            chore
            style
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject should not start with an uppercase letter.

  commitlint:
    name: Conventional commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository (full history for range linting)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the commit tooling
        run: npm install --no-audit --no-fund

      - name: Lint every commit in the pull request
        run: npx --no -- commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

  label-pr:
    name: Label the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

  danger:
    name: Danger Swift review
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Danger is the reviewer who always shows up; it advises, it does
      # not block. Both steps tolerate failure (step-level
      # continue-on-error keeps this check green) and annotate what went
      # wrong, so an advisory outage never masks a healthy merge.
      - name: Install Danger Swift
        continue-on-error: true
        run: |
          # Newer Homebrew refuses formulas from untrusted taps until the
          # tap is explicitly trusted.
          brew trust danger/tap </dev/null || true
          status=0
          HOMEBREW_NO_AUTO_UPDATE=1 brew install danger/tap/danger-swift 2>&1 | tee /tmp/brew-install.log || status=$?
          if [[ "${status}" -ne 0 ]]; then
            grep -E 'Error|error' /tmp/brew-install.log | tail -5 | while IFS= read -r line; do
              printf '::error title=brew::%s\n' "${line}"
            done || true
            exit "${status}"
          fi

      - name: Run Danger
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=0
          danger-swift ci --dangerfile Dangerfile.swift 2>&1 | tee /tmp/danger.log || status=$?
          if [[ "${status}" -ne 0 ]]; then
            grep -E 'error|Error|failed|Failed' /tmp/danger.log | tail -5 | while IFS= read -r line; do
              printf '::error title=Danger::%s\n' "${line}"
            done || true
            exit "${status}"
          fi
