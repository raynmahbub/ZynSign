# Build validation.
#
# The gate that stops broken code before it reaches main: resolves Swift
# packages, cleans DerivedData, builds every target, builds the test
# targets, and runs the unit tests. All logic lives in Scripts/ci/build.sh;
# this workflow only wires triggers, caching, and failure evidence.
name: Build Validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# The newest commit is the one whose verdict matters; superseded runs stop.
concurrency:
  group: build-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build every target and run unit tests
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Record the toolchain versions
        run: |
          set -eu
          xcodebuild -version
          xcrun simctl list runtimes | head -n 20 || true

      # The project vendors no external packages today; the cache is wired
      # now so the first adopted package resolves instantly.
      - name: Restore Swift Package cache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'ZynSign.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build, build test targets, and run unit tests
        run: Scripts/ci/build.sh

      - name: Upload build and test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-validation-logs
          path: |
            build/logs/*.log
            build/logs/ZynSignTests.xcresult
          if-no-files-found: warn
          retention-days: 14
