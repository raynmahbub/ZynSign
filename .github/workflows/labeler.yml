# Label automation.
#
# Two jobs: label-sync keeps the repository's label set exactly as
# declared in .github/labels.json (idempotent, safe to re-run), and
# labeler applies path-based labels to every pull request from
# .github/labeler.yml. Release Drafter reads these labels.
name: Labeler

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number || 'sync' }}
  cancel-in-progress: true

jobs:
  label-sync:
    name: Sync the label definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create or update labels from labels.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          jq -c '.[]' .github/labels.json | while IFS= read -r label; do
            name="$(echo "${label}" | jq -r '.name')"
            color="$(echo "${label}" | jq -r '.color')"
            description="$(echo "${label}" | jq -r '.description')"
            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" --silent 2>/dev/null; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/labels/${name}" \
                -f "color=${color}" -f "description=${description}" --silent
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f "name=${name}" -f "color=${color}" -f "description=${description}" --silent
            fi
            echo "label '${name}' in sync"
          done

  label-pr:
    name: Label the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
