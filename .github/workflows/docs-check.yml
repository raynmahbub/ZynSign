# Documentation protection.
#
# Broken links and missing images fail the run; orphaned pages and
# markdown-quality findings are reported as warnings for the weekly
# maintenance bot. Logic: Scripts/ci/docs_check.sh.
name: Documentation Check

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-check:
    name: Links, images, orphans, markdown quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the documentation
        run: Scripts/ci/docs_check.sh
