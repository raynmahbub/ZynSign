# ⚙ Command Center — repository intelligence, weekly and on demand.
#
# Reports by default, repairs only when asked: this workflow never gates a pull
# request and never publishes a release. Every Monday the repository inspects
# itself and uploads the result — **nothing is committed, formatted, relabelled
# or closed by a scheduled run.** The repair jobs publish, auto-format, sync
# README and labels, and run the stale bot; they run only for a manual dispatch
# that names `mode: repair`. That is the rule the workflow now enforces by
# construction: scheduled automation reads, analyses, and reports, and a
# repository change needs a person to ask for it.
#
# Every Monday the repository inspects itself:
#
#   reports          — SwiftLint summary, SwiftFormat check, architecture
#                      report, dependency report, documentation report,
#                      Periphery dead-code report, complexity report,
#                      and the regenerated dashboards
#   publish          — repair only: commits docs/internal/ dashboard + history
#                      updates (documentation only — production code is never
#                      modified by this workflow)
#   regression-check — compares this run with the last; it opens a maintenance
#                      issue in repair mode and writes the same finding to the
#                      run summary in report mode
#   autoformat       — repair only: applies the SwiftFormat rule set as one
#                      clean style commit when anything drifted
#   readme-sync      — repair only: repairs README.md when it drifted from
#                      MARKETING_VERSION / WHAT_DOES_NOT_EXIST.md
#                      (02-quality.yml refuses the drift on a PR)
#   label-sync       — repair only: keeps the label set exactly as
#                      .github/labels.json declares it (idempotent)
#   stale            — repair only: marks inactive issues and PRs stale, then
#                      closes them
#
# Run it any time with Actions → ⚙ Command Center → Run workflow for the same
# diagnostics on demand — `report` to look, `repair` to let it change the
# repository.
#
# The Periphery dead-code scan used to run on every pull request as its own
# workflow; it is advisory and slow (a 40-minute macOS job), so it lives here
# where the report is published anyway. The stale bot used to run daily — a
# weekly pass changes nothing at 60-day and 14-day thresholds.
#
name: ⚙ Command Center

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "report = analyse and upload only; repair = also publish dashboards, format, sync README and labels, and run the stale bot"
        type: choice
        options:
          - report
          - repair
        default: report

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: maintenance
  cancel-in-progress: false

# Repairs are opt-in. A scheduled run — and a manual run that did not name
# `repair` — analyses and uploads; it does not write to the repository.
env:
  REPAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'repair' }}

jobs:
  reports:
    name: Generate the engineering reports
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Select the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install the analysis tooling
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftlint swiftformat periphery

      - name: SwiftLint summary
        run: |
          set -uo pipefail
          Scripts/ci/lint.sh 2>&1 | tee build/metrics/swiftlint.txt || true

      - name: SwiftFormat check
        run: Scripts/ci/format.sh check 2>&1 | tee build/metrics/swiftformat.txt || true

      - name: Architecture report
        run: Scripts/ci/architecture_guard.sh 2>&1 | tee build/metrics/architecture-run.txt || true

      - name: Dependency report
        run: Scripts/ci/dependency_check.sh 2>&1 | tee build/metrics/dependency-run.txt || true

      - name: Documentation report
        run: Scripts/ci/docs_check.sh 2>&1 | tee build/metrics/docs-run.txt || true

      - name: Complexity report
        run: Scripts/ci/complexity_check.sh 2>&1 | tee build/metrics/complexity-run.txt || true

      - name: Dead code report (Periphery)
        run: Scripts/ci/dead_code_scan.sh 2>&1 | tee build/metrics/dead-code-run.txt || true

      - name: Regenerate the dashboards
        run: Scripts/ci/metrics_report.sh

      - name: Record whether this run may repair
        run: |
          if [ "${REPAIR}" = "true" ]; then
            echo "**Repair mode.** The publish, auto-format, README, label and stale jobs will run after this one." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Report mode.** Nothing was committed, formatted, relabelled, or closed." >> "$GITHUB_STEP_SUMMARY"
            echo "Run *Actions → ⚙ Command Center → Run workflow* with mode **repair** to apply what the reports below list." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the maintenance bundle
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-bundle
          path: |
            docs/internal/RepositoryHealth.md
            docs/internal/EngineeringCommandCenter.md
            docs/internal/metrics-history.csv
            Reports/
            build/metrics/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Commit the dashboard updates (repair mode)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
    runs-on: ubuntu-latest
    needs: reports
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Download the maintenance bundle
        uses: actions/download-artifact@v4
        with:
          name: maintenance-bundle

      - name: Commit documentation-only updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/internal/RepositoryHealth.md docs/internal/EngineeringCommandCenter.md docs/internal/metrics-history.csv
          if git diff --cached --quiet; then
            echo "Dashboards unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(maintenance): weekly engineering dashboards

          Generated by the maintenance workflow. Documentation only —
          no production code was modified."
          BRANCH="${{ github.event.repository.default_branch }}"
          if git push origin "HEAD:${BRANCH}"; then
            echo "Dashboards published to ${BRANCH}."
          else
            echo "::warning::Direct push blocked (branch protection?) — opening a dashboard PR instead."
            FIX="maintenance/dashboards-$(date +%Y%m%d-%H%M)"
            git checkout -b "${FIX}"
            git push origin "${FIX}"
            gh pr create --base "${BRANCH}" --head "${FIX}" \
              --title "chore(maintenance): weekly engineering dashboards" \
              --body "Automated dashboard update from the weekly maintenance run."
          fi

  regression-check:
    name: Report a quality regression (opens an issue in repair mode)
    runs-on: ubuntu-latest
    needs: reports
    timeout-minutes: 10
    steps:
      - name: Download the maintenance bundle
        uses: actions/download-artifact@v4
        with:
          name: maintenance-bundle

      - name: Compare against the previous measurement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          HISTORY="docs/internal/metrics-history.csv"
          if [ ! -f "${HISTORY}" ]; then echo "No history yet."; exit 0; fi
          ROWS="$(tail -n +2 "${HISTORY}" | tail -2)"
          if [ "$(printf '%s\n' "${ROWS}" | wc -l)" -lt 2 ]; then
            echo "Only one measurement so far — nothing to compare."
            exit 0
          fi
          PREV="$(printf '%s\n' "${ROWS}" | head -1)"
          CURR="$(printf '%s\n' "${ROWS}" | tail -1)"
          prev_score="$(echo "${PREV}" | cut -d, -f10)"
          curr_score="$(echo "${CURR}" | cut -d, -f10)"
          prev_viol="$(echo "${PREV}" | cut -d, -f6)"
          curr_viol="$(echo "${CURR}" | cut -d, -f6)"
          REGRESSED=0
          [ "$((curr_score + 5))" -lt "${prev_score}" ] && REGRESSED=1
          [ "${curr_viol}" -gt "${prev_viol}" ] && REGRESSED=1
          if [ "${REGRESSED}" -eq 0 ]; then
            echo "Quality stable: readiness ${curr_score}% (was ${prev_score}%), architecture violations ${curr_viol} (was ${prev_viol})."
            exit 0
          fi
          TITLE="Maintenance: engineering quality regressed"
          if gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "A maintenance regression issue is already open."
            exit 0
          fi
          BODY="The weekly maintenance run detected a quality regression.

          | Measurement | Previous | Current |
          | --- | --- | --- |
          | Readiness score | ${prev_score}% | ${curr_score}% |
          | Architecture violations | ${prev_viol} | ${curr_viol} |

          Full evidence: [maintenance run](${RUN_URL}) — artifact **maintenance-bundle**.
          Dashboards: docs/internal/RepositoryHealth.md and docs/internal/EngineeringCommandCenter.md.

          _Opened automatically by the maintenance workflow. Nothing was changed automatically — review first._"
          BODY="$(printf '%s\n' "${BODY}" | sed 's/^          //')"
          if [ "${REPAIR}" != "true" ]; then
            echo "::warning::${TITLE} — report mode, so no issue was opened. Re-run with mode=repair to record it."
            {
              echo "## Quality regression"
              echo
              printf '%s\n' "${BODY}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh issue create --title "${TITLE}" --label maintenance --body "${BODY}"

  autoformat:
    name: Apply SwiftFormat (single clean style commit, repair mode)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
    runs-on: macos-15
    needs: reports
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install SwiftFormat
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install swiftformat

      - name: Apply the pinned rule set
        run: Scripts/ci/format.sh apply

      - name: Commit if anything drifted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if git diff --quiet; then
            echo "Formatting already clean — no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply SwiftFormat (weekly maintenance)

          The pinned rule set from .swiftformat — trailing whitespace and
          consecutive blank lines only. Generated by the maintenance workflow."
          BRANCH="${{ github.event.repository.default_branch }}"
          if git push origin "HEAD:${BRANCH}"; then
            echo "Format fix published to ${BRANCH}."
          else
            echo "::warning::Direct push blocked (branch protection?) — opening a format PR instead."
            FIX="maintenance/format-$(date +%Y%m%d-%H%M)"
            git checkout -b "${FIX}"
            git push origin "${FIX}"
            gh pr create --base "${BRANCH}" --head "${FIX}" \
              --title "style: apply SwiftFormat (weekly maintenance)" \
              --body "Automated formatting from the weekly maintenance run. The pinned rule set only touches whitespace."
          fi

  readme-sync:
    name: Repair a stale README (repair mode)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # 02-quality.yml refuses a stale README on a pull request; this is the
      # repair path for the default branch, so the storefront cannot drift.
      - name: Bring README.md back in line
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if python3 Scripts/update_readme.py --check; then
            echo "README is current — nothing to do."
            exit 0
          fi
          echo "README is stale — regenerating from MARKETING_VERSION and WHAT_DOES_NOT_EXIST.md"
          python3 Scripts/update_readme.py
          git diff -- README.md | head -n 80
          if git diff --quiet -- README.md; then
            echo "::warning::--check failed but the writer produced no diff — the two disagree; investigate Scripts/update_readme.py."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): auto-sync version and counts

          Generated by the maintenance workflow from MARKETING_VERSION and
          docs/product/WHAT_DOES_NOT_EXIST.md. Documentation only."
          BRANCH="${{ github.event.repository.default_branch }}"
          if git push origin "HEAD:${BRANCH}"; then
            echo "README fix published to ${BRANCH}."
          else
            echo "::warning::Direct push blocked (branch protection?) — opening a README PR instead."
            FIX="maintenance/readme-$(date +%Y%m%d-%H%M)"
            git checkout -b "${FIX}"
            git push origin "${FIX}"
            gh pr create --base "${BRANCH}" --head "${FIX}" \
              --title "docs(readme): auto-sync version and counts" \
              --body "Automated README repair from the weekly maintenance run (MARKETING_VERSION + WHAT_DOES_NOT_EXIST.md)."
          fi

  label-sync:
    name: Sync the label definitions (repair mode)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Idempotent: the label set always ends up exactly as declared, so
      # Release Drafter's categories and the PR labeler stay wired.
      - name: Create or update labels from labels.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          jq -c '.[]' .github/labels.json | while IFS= read -r label; do
            name="$(echo "${label}" | jq -r '.name')"
            color="$(echo "${label}" | jq -r '.color')"
            description="$(echo "${label}" | jq -r '.description')"
            if gh api "repos/${GITHUB_REPOSITORY}/labels/${name}" --silent 2>/dev/null; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/labels/${name}" \
                -f "color=${color}" -f "description=${description}" --silent
            else
              gh api -X POST "repos/${GITHUB_REPOSITORY}/labels" \
                -f "name=${name}" -f "color=${color}" -f "description=${description}" --silent
            fi
            echo "label '${name}' in sync"
          done

  stale:
    name: Mark and close inactive work (repair mode)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'repair'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Keeps the tracker honest: no activity for 60 days marks an issue or
      # pull request stale, 14 more days closes it. Security reports,
      # regressions under work, and pinned items are exempt.
      - name: Run the stale bot
        uses: actions/stale@v11
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          close-issue-label: stale
          close-pr-label: stale
          exempt-issue-labels: "pinned,security,regression,maintenance"
          exempt-pr-labels: "pinned,security"
          exempt-draft-pr: true
          stale-issue-message: >-
            This issue has had no activity for 60 days and is marked stale.
            Comment or it closes in 14 days. (ZynSign maintenance bot.)
          stale-pr-message: >-
            This pull request has had no activity for 60 days and is marked
            stale. Comment or push updates, or it closes in 14 days.
            (ZynSign maintenance bot.)
          close-issue-message: >-
            Closed as stale. Reopen with fresh context any time.
          close-pr-message: >-
            Closed as stale. Reopen or open a fresh pull request any time.
