# Release — one tag per stop on the release train
#
# ZynSign ships its finished features one release at a time
# (docs/releases/release-train.md). For every release:
#   python3 Scripts/release_train.py promote      # switch on the next features
#   # update CHANGELOG + notes, private test, merge to main
#   git tag -a v0.1.0-alpha.1 -m "ZynSign 0.1.0-alpha.1" && git push origin v0.1.0-alpha.1
#
# This workflow runs on the tag and
#   1. refuses to release if the tag is not ReleaseTrain.current
#      (Scripts/release_train.py check --tag), so a tag can never ship the
#      wrong set of features;
#   2. ensures CHANGELOG.md has an entry for that version
#      (Scripts/generate_changelog.py) and commits it to the default branch
#      if needed;
#   3. ensures the GitHub Release exists with docs/releases/notes-v{version}.md
#      as its body, marked pre-release for alpha / beta / rc tags.
#
# It is idempotent and never rebuilds the binary: the privately tested IPA
# is the public IPA.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  changelog-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # when triggered by tag, checkout the tag; for dispatch, the default branch
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.event.repository.default_branch }}

      - name: Derive version and date
        id: meta
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          DATE="$(date +%Y-%m-%d)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "Version=${VERSION} Tag=${TAG} Date=${DATE}"

      - name: Refuse a tag that is not the current release-train stage
        run: python3 Scripts/release_train.py check --tag "${{ steps.meta.outputs.tag }}"

      - name: Generate CHANGELOG entry if missing
        id: changelog
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          TAG="${{ steps.meta.outputs.tag }}"
          echo "Running generate_changelog for ${VERSION} (${TAG})"
          python3 Scripts/generate_changelog.py --version "${VERSION}" --tag "${TAG}" --date "${DATE}" || true
          if git diff --quiet -- CHANGELOG.md "docs/releases/notes-v${VERSION}.md"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG change."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG changed:"
            git diff -- CHANGELOG.md | head -n 120
          fi

      - name: Commit CHANGELOG to the default branch (if changed)
        if: steps.changelog.outputs.changed == 'true'
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md "docs/releases/notes-v${VERSION}.md"
          git commit -m "docs(changelog): auto ${TAG} — ${VERSION} release

          Generated by Scripts/generate_changelog.py on tag ${TAG}; see docs/releases/release-train.md."
          # Push to the default branch that holds the tag's history, not to the tag itself.
          BRANCH="${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${BRANCH}" || {
            echo "::warning::Could not push CHANGELOG to ${BRANCH} — branch may have moved. Push manually:"
            echo "  git push origin HEAD:${BRANCH}"
            exit 0
          }

      - name: Ensure GitHub Release exists with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="docs/releases/notes-v${VERSION}.md"
          TITLE="ZynSign ${VERSION}"
          if [ "${VERSION}" = "0.1.0" ]; then
            TITLE="ZynSign 0.1.0 Horizon"
          fi
          # alpha / beta / rc tags are GitHub pre-releases; 0.1.0 and 1.0.0+ are not.
          PRERELEASE=""
          case "${VERSION}" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating notes if needed."
            if [ -f "${NOTES}" ]; then
              gh release edit "${TAG}" --notes-file "${NOTES}" --title "${TITLE}" || true
            fi
          else
            echo "Creating release ${TAG}"
            if [ -f "${NOTES}" ]; then
              gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TITLE}" ${PRERELEASE} --notes-file "${NOTES}" || true
            else
              # fallback to auto-generated notes from commits
              gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TITLE}" ${PRERELEASE} --generate-notes || true
            fi
          fi
          gh release view "${TAG}" --json tagName,title,url || true
