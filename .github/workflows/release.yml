# Release — auto changelog on public dev tag
#
# When you publish the first public dev build (market 0.1.0, build 3):
#   git tag -a v0.1.0 -m "ZynSign 0.1.0 Horizon — first public dev" HEAD
#   git push origin tag v0.1.0
#
# This workflow runs on the tag, ensures CHANGELOG.md has an entry for
# that version (via Scripts/generate_changelog.py), commits it to
# arena/01a0d4c7-zynsign if needed, and ensures the GitHub Release exists
# with docs/releases/notes-v{version}.md as its body.
#
# It is idempotent — if CHANGELOG already has the version, no commit.
# It never rebuilds the binary; market 0.1.0 (3) private IPA == public IPA.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v, e.g. 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  changelog-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # when triggered by tag, checkout the tag; for dispatch, checkout arena branch
          ref: ${{ github.ref_name || 'arena/01a0d4c7-zynsign' }}

      - name: Derive version and date
        id: meta
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          DATE="$(date +%Y-%m-%d)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "Version=${VERSION} Tag=${TAG} Date=${DATE}"

      - name: Generate CHANGELOG entry if missing
        id: changelog
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          DATE="${{ steps.meta.outputs.date }}"
          TAG="${{ steps.meta.outputs.tag }}"
          echo "Running generate_changelog for ${VERSION} (${TAG})"
          python3 Scripts/generate_changelog.py --version "${VERSION}" --tag "${TAG}" --date "${DATE}" || true
          if git diff --quiet -- CHANGELOG.md "docs/releases/notes-v${VERSION}.md"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG change."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG changed:"
            git diff -- CHANGELOG.md | head -n 120
          fi

      - name: Commit CHANGELOG to arena branch (if changed)
        if: steps.changelog.outputs.changed == 'true'
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md "docs/releases/notes-v${VERSION}.md"
          git commit -m "docs(changelog): auto ${TAG} — ${VERSION} release (private-tested 0.1.0 build 3)

          Generated by Scripts/generate_changelog.py on tag ${TAG}; see docs/releases/private-testing.md."
          # Push to the arena branch that holds the tag's history, not to the tag itself.
          # The tag commit is an ancestor of origin/arena/01a0d4c7-zynsign; fast-forward it.
          git push origin HEAD:arena/01a0d4c7-zynsign || {
            echo "::warning::Could not push CHANGELOG to arena/01a0d4c7-zynsign — branch may have moved. Push manually:"
            echo "  git push origin HEAD:arena/01a0d4c7-zynsign"
            exit 0
          }

      - name: Ensure GitHub Release exists with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="docs/releases/notes-v${VERSION}.md"
          TITLE="ZynSign ${VERSION} — first public dev"
          if [ "${VERSION}" = "0.1.0" ]; then
            TITLE="ZynSign 0.1.0 Horizon — first public dev (private-tested)"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating notes if needed."
            if [ -f "${NOTES}" ]; then
              gh release edit "${TAG}" --notes-file "${NOTES}" --title "${TITLE}" || true
            fi
          else
            echo "Creating release ${TAG}"
            if [ -f "${NOTES}" ]; then
              gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TITLE}" --notes-file "${NOTES}" || true
            else
              # fallback to auto-generated notes from commits
              gh release create "${TAG}" --target "${GITHUB_SHA}" --title "${TITLE}" --generate-notes || true
            fi
          fi
          gh release view "${TAG}" --json tagName,title,url || true
