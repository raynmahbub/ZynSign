# ZynSign continuous integration.
#
# Builds the application target, runs the unit-test target on a simulator,
# and runs repository-hygiene checks. See
# docs/development/continuous-integration.md for what each job establishes
# and what it explicitly does not claim.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# TEMPORARY (revert before merge): lets failing runs report error lines to
# the PR because this sandbox cannot download action logs.
permissions:
  contents: read
  pull-requests: write

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Refuse private keys and misplaced certificates
        run: |
          set -eu
          if grep -rniE "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" \
              --exclude-dir=.git . ; then
            echo "Private key material found in the repository." >&2
            exit 1
          fi
          # Synthetic certificate text is allowed only in test fixtures, which
          # use it as rejection vectors and embed no private keys. The
          # bracket keeps this pattern from matching its own line.
          if grep -rniE "BEGIN CERT[I]FICATE" \
              --exclude-dir=.git --exclude-dir=Tests . ; then
            echo "Certificate material found outside test fixtures." >&2
            exit 1
          fi

      - name: Refuse generated artifacts and machine state
        run: |
          set -eu
          forbidden="DerivedData xcuserdata *.xcresult *.xcuserstate .DS_Store"
          failed=0
          for pattern in $forbidden; do
            if find . -path ./.git -prune -o -name "$pattern" -print | grep -q .; then
              echo "Forbidden path present: $pattern" >&2
              failed=1
            fi
          done
          exit $failed

      - name: Run host vector checks
        run: |
          set -eu
          python3 Tests/Host/verify_macho_signing_vector.py
          python3 Tests/Host/verify_nested_code_signing_vector.py
          python3 Tests/Host/verify_zip_writer_vectors.py

  build-and-test:
    name: Build and test (Xcode)
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain versions
        run: |
          set -eu
          xcodebuild -version
          xcrun simctl list runtimes | head -n 20 || true

      - name: Build the application target
        run: |
          set -eu
          xcodebuild build \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination 'generic/platform=iOS Simulator' \
            -quiet

      - name: Run the unit-test target
        run: |
          set -eu
          xcodebuild test \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -quiet

      # TEMPORARY (revert before merge): re-runs the test command verbosely
      # and posts the error lines to the PR.
      - name: Report failure details to the PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          xcodebuild test \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            > /tmp/zynsign-test-output.txt 2>&1
          grep -E "error:|FAILED|failed \(" /tmp/zynsign-test-output.txt \
            | sort -u | head -n 100 > /tmp/zynsign-errors.txt || true
          {
            echo "### Diagnostic report for \`${{ github.sha }}\` (temporary step, will be reverted)"
            echo
            if [ -s /tmp/zynsign-errors.txt ]; then
              echo '```text'
              head -c 50000 /tmp/zynsign-errors.txt
              echo '```'
            else
              echo "No error lines captured. Output tail:"
              echo '```text'
              tail -c 50000 /tmp/zynsign-test-output.txt
              echo '```'
            fi
          } > /tmp/zynsign-comment.md
          gh pr comment 30 --body-file /tmp/zynsign-comment.md
          exit 0
