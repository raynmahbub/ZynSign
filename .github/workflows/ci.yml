# ZynSign continuous integration.
#
# Builds the application target, runs the unit-test target on a simulator,
# packages the simulator application as a downloadable artifact, builds an
# unsigned device IPA, and runs repository-hygiene checks. See
# docs/development/continuous-integration.md for what each job establishes
# and what it explicitly does not claim.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Refuse private keys and misplaced certificates
        run: |
          set -eu
          if grep -rniE "BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY" \
              --exclude-dir=.git . ; then
            echo "Private key material found in the repository." >&2
            exit 1
          fi
          # Synthetic certificate text is allowed only in test fixtures, which
          # use it as rejection vectors and embed no private keys. The
          # bracket keeps this pattern from matching its own line.
          if grep -rniE "BEGIN CERT[I]FICATE" \
              --exclude-dir=.git --exclude-dir=Tests . ; then
            echo "Certificate material found outside test fixtures." >&2
            exit 1
          fi

      - name: Refuse generated artifacts and machine state
        run: |
          set -eu
          forbidden="DerivedData xcuserdata *.xcresult *.xcuserstate .DS_Store"
          failed=0
          for pattern in $forbidden; do
            if find . -path ./.git -prune -o -name "$pattern" -print | grep -q .; then
              echo "Forbidden path present: $pattern" >&2
              failed=1
            fi
          done
          exit $failed

      - name: Run host vector checks
        run: |
          set -eu
          python3 Tests/Host/verify_macho_signing_vector.py
          python3 Tests/Host/verify_nested_code_signing_vector.py
          python3 Tests/Host/verify_zip_writer_vectors.py
          python3 Tests/Host/external_validation.py self-test

  build-and-test:
    name: Build and test (Xcode)
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain versions
        run: |
          set -eu
          xcodebuild -version
          xcrun simctl list runtimes | head -n 20 || true

      - name: Build the application target
        run: |
          set -eu
          echo "ZYNSIGN_DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          xcodebuild build \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet

      - name: Run the unit-test target
        run: |
          set -eu
          xcodebuild test \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -quiet

      # A simulator .app only: installable on an iOS Simulator with
      # `xcrun simctl install`. It is not an IPA, is not signed for a
      # device, and is not a release artifact.
      - name: Package the simulator application
        run: |
          set -eu
          app_path=$(find "$ZYNSIGN_DERIVED_DATA/Build/Products" \
            -maxdepth 2 -type d -name 'ZynSign.app' -print -quit)
          if [ -z "$app_path" ]; then
            echo "ZynSign.app not found under the derived-data products." >&2
            exit 1
          fi
          echo "Packaging: $app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" "$RUNNER_TEMP/ZynSign-simulator.zip"
          ditto -x -k "$RUNNER_TEMP/ZynSign-simulator.zip" \
            "$RUNNER_TEMP/zip-check"
          test -d "$RUNNER_TEMP/zip-check/ZynSign.app"

      - name: Upload the simulator application
        uses: actions/upload-artifact@v4
        with:
          name: ZynSign-simulator
          path: ${{ runner.temp }}/ZynSign-simulator.zip
          if-no-files-found: error
          retention-days: 30

  # A device build with code signing disabled end to end. No Apple
  # credentials exist in this repository or in CI, so the resulting
  # .ipa carries no signature and is not installable as-is: installing
  # it requires a separate signing step with the user's own certificate
  # or tool. Not a release.
  unsigned-ipa:
    name: Unsigned IPA (device build)
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain versions
        run: |
          set -eu
          echo "IPA_ROOT=$RUNNER_TEMP/unsigned-ipa" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Build the application target without a signature
        run: |
          set -eu
          xcodebuild build \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package the unsigned application as an IPA
        run: |
          set -eu
          app_path=$(find "$RUNNER_TEMP/DerivedData/Build/Products" \
            -maxdepth 2 -type d -name 'ZynSign.app' -path '*iphoneos*' \
            -print -quit)
          if [ -z "$app_path" ]; then
            echo "ZynSign.app not found under the derived-data products." >&2
            exit 1
          fi
          test -f "$app_path/ZynSign"
          # The build must carry no code signature at all.
          if codesign -d "$app_path" >/dev/null 2>&1; then
            echo "The build unexpectedly carries a code signature." >&2
            exit 1
          fi
          stage="$IPA_ROOT/stage"
          mkdir -p "$stage/Payload"
          ditto "$app_path" "$stage/Payload/ZynSign.app"
          ipa_path="$IPA_ROOT/ZynSign-unsigned.ipa"
          (cd "$stage" && zip -qry "$ipa_path" Payload)
          unzip -t "$ipa_path"
          unzip -l "$ipa_path" | grep -q "Payload/ZynSign.app/Info.plist"

      - name: Upload the unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZynSign-unsigned-ipa
          path: ${{ runner.temp }}/unsigned-ipa/ZynSign-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  # Measurement, not a gate: ZynSign-signed artifacts judged by Apple's
  # developer tooling. The job fails only when the harness cannot do its job
  # (the export or a tool is missing); codesign rejections are findings,
  # recorded in the report. See docs/architecture/external-validation.md.
  external-validation:
    name: External validation (Apple tooling)
    runs-on: macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select the newest available Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show the toolchain versions
        run: |
          set -eu
          echo "EXPORT_ROOT=$RUNNER_TEMP/zynsign-external-validation" >> "$GITHUB_ENV"
          sw_vers
          xcodebuild -version
          command -v codesign otool ditto unzip
          openssl version || true

      - name: Export ZynSign-signed artifacts
        id: export
        run: |
          set -u
          mkdir -p "$EXPORT_ROOT/export"
          set +e
          TEST_RUNNER_ZYNSIGN_EXPORT_DIR="$EXPORT_ROOT/export" xcodebuild test \
            -project ZynSign.xcodeproj \
            -scheme ZynSign \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -only-testing:ZynSignTests/ExternalValidationExportTests \
            -quiet 2>&1 | tee "$EXPORT_ROOT/export-xcodebuild.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            python3 Tests/Host/external_validation.py annotate-xcodebuild \
              "$EXPORT_ROOT/export-xcodebuild.log"
          fi

      - name: Judge the artifacts with Apple tooling
        run: |
          python3 Tests/Host/external_validation.py run \
            --export-dir "$EXPORT_ROOT/export" \
            --report-dir "$EXPORT_ROOT/report" \
            --export-status "${{ steps.export.outputs.status || 99 }}"

      - name: Upload the report and the exported artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-validation
          path: |
            ${{ env.EXPORT_ROOT }}/report
            ${{ env.EXPORT_ROOT }}/export
            ${{ env.EXPORT_ROOT }}/export-xcodebuild.log
          if-no-files-found: warn
          retention-days: 30
